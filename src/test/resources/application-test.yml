spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:derdimet_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

derdimet:
  jwt:
    secret: test-jwt-secret-at-least-32-characters-long
    access-expiration-ms: 604800000
  cors:
    allowed-origin-patterns: "*"
  seed:
    enabled: false
  rate-limit:
    enabled: false
