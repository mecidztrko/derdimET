# Ortak ayarlar — hassas değerler yalnızca ortam değişkeni veya profil dosyasında.
# Yerel geliştirme: SPRING_PROFILES_ACTIVE=dev (varsayılan) + kök .env dosyası
# Üretim: SPRING_PROFILES_ACTIVE=prod + sunucu ortam değişkenleri

spring:
  application:
    name: derdimet
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      enabled: true
      max-file-size: ${DERDIMET_MAX_FILE_SIZE:10MB}
      max-request-size: ${DERDIMET_MAX_REQUEST_SIZE:60MB}
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8081}

derdimet:
  jwt:
    expiration-ms: ${DERDIMET_JWT_EXPIRATION_MS:604800000}
  media:
    upload-dir: ${DERDIMET_UPLOAD_DIR:uploads}
    public-url-prefix: ${DERDIMET_UPLOAD_PUBLIC_PREFIX:/uploads}
    max-file-size: ${DERDIMET_UPLOAD_MAX_FILE_SIZE:8388608}
  cors:
    allowed-origin-patterns: ${DERDIMET_CORS_ALLOWED_ORIGIN_PATTERNS:}
  seed:
    enabled: ${DERDIMET_SEED:false}
  swagger:
    enabled: ${DERDIMET_SWAGGER_ENABLED:true}
  mail:
    enabled: ${DERDIMET_MAIL_ENABLED:false}
    from: ${DERDIMET_MAIL_FROM:noreply@derdimet.local}
    from-name: ${DERDIMET_MAIL_FROM_NAME:derdimET}
  push:
    enabled: ${DERDIMET_PUSH_ENABLED:false}
    fcm-server-key: ${DERDIMET_FCM_SERVER_KEY:}

springdoc:
  api-docs:
    enabled: ${DERDIMET_SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${DERDIMET_SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
    persist-authorization: true
